<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plagiarism Detector Interactive Dashboard</title>
    <!-- Tailwind CSS CDN untuk styling premium -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts untuk tipografi modern -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- React & Babel CDN untuk menjalankan React langsung di browser -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        // Mengonfigurasi kustomisasi Tailwind
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50/50 min-h-screen text-slate-800 antialiased">
    
    <!-- Wadah Aplikasi React -->
    <div id="root"></div>

    <!-- Script Utama React + Babel -->
    <script type="text/babel">
        const { useState } = React;

        // --- 1. KOMPONEN HEATMAP PLAGIARISME INTERAKTIF ---
        function SimilarityHeatmap({ matrix, documents }) {
            const [hoveredCell, setHoveredCell] = useState(null);
            const [selectedPair, setSelectedPair] = useState(null);

            if (!matrix || matrix.length === 0 || !documents || documents.length === 0) {
                return (
                    <div className="flex items-center justify-center p-8 bg-slate-50 border border-slate-200 rounded-2xl text-slate-500">
                        <p className="text-sm font-medium">Tidak ada data matriks kemiripan untuk ditampilkan.</p>
                    </div>
                );
            }

            const N = matrix.length;

            const getCellStyles = (score, i, j) => {
                if (i === j) return "bg-slate-100 text-slate-400 cursor-not-allowed";
                if (score < 30) return "bg-emerald-500/10 text-emerald-800 hover:bg-emerald-500/20 hover:scale-105 transition-all cursor-pointer";
                if (score >= 30 && score < 70) return "bg-amber-500/30 text-amber-950 hover:bg-amber-500/45 hover:scale-105 transition-all cursor-pointer";
                return "bg-rose-500 text-white font-bold hover:bg-rose-600 hover:scale-105 transition-all shadow-md shadow-rose-500/10 border-2 border-rose-600 cursor-pointer";
            };

            const handleCellClick = (i, j, score) => {
                if (i === j) return;
                setSelectedPair({
                    docAIndex: i,
                    docBIndex: j,
                    score: score,
                    textA: documents[i],
                    textB: documents[j]
                });
            };

            return (
                <div className="w-full space-y-8">
                    {/* Kartu Utama Heatmap */}
                    <div className="p-6 bg-white border border-slate-200/80 shadow-xl shadow-slate-100/50 rounded-3xl">
                        <div className="flex flex-col md:flex-row md:items-center md:justify-between border-b border-slate-100 pb-4 mb-6">
                            <div>
                                <h3 className="text-lg font-bold text-slate-900">Interactive Similarity Matrix Heatmap</h3>
                                <p className="text-xs text-slate-500 mt-0.5">Arahkan kursor atau klik sel untuk membandingkan isi dokumen.</p>
                            </div>
                            
                            {/* Legenda Indikator Warna */}
                            <div className="flex items-center space-x-4 mt-3 md:mt-0 text-xs">
                                <span className="font-semibold text-slate-600">Legend:</span>
                                <div className="flex items-center space-x-1">
                                    <span className="w-3 h-3 bg-emerald-500/20 rounded-md border border-emerald-500/30"></span>
                                    <span className="text-slate-500">&lt; 30% (Low)</span>
                                </div>
                                <div className="flex items-center space-x-1">
                                    <span className="w-3 h-3 bg-amber-500/35 rounded-md border border-amber-500/40"></span>
                                    <span className="text-slate-500">30% - 70% (Medium)</span>
                                </div>
                                <div className="flex items-center space-x-1">
                                    <span className="w-3 h-3 bg-rose-500 rounded-md shadow-sm"></span>
                                    <span className="text-slate-500">&ge; 70% (High)</span>
                                </div>
                            </div>
                        </div>

                        {/* Tabel Grid Heatmap */}
                        <div className="overflow-x-auto">
                            <table className="w-full border-collapse">
                                <thead>
                                    <tr>
                                        <th className="p-3 bg-slate-50/50 border border-slate-100 rounded-tl-xl text-xs font-bold text-slate-400 text-center w-24">
                                            Dokumen
                                        </th>
                                        {matrix.map((_, idx) => (
                                            <th key={idx} className="p-3 bg-slate-50/50 border border-slate-100 text-xs font-bold text-slate-600 text-center w-24">
                                                Doc {idx + 1}
                                            </th>
                                        ))}
                                    </tr>
                                </thead>
                                <tbody>
                                    {matrix.map((row, i) => (
                                        <tr key={i} className="group hover:bg-slate-50/30 transition-colors">
                                            <td className="p-3 border border-slate-100 bg-slate-50/50 text-xs font-bold text-slate-600 text-center">
                                                Doc {i + 1}
                                            </td>
                                            {row.map((score, j) => {
                                                const isHovered = hoveredCell && (hoveredCell.i === i || hoveredCell.j === j);
                                                return (
                                                    <td
                                                        key={j}
                                                        className={`p-1 border border-slate-100 text-center font-mono text-sm relative transition-all duration-150 ${
                                                            isHovered ? "bg-slate-50/70" : ""
                                                        }`}
                                                        onMouseEnter={() => setHoveredCell({ i, j, score })}
                                                        onMouseLeave={() => setHoveredCell(null)}
                                                        onClick={() => handleCellClick(i, j, score)}
                                                    >
                                                        <button
                                                            className={`w-full py-3.5 rounded-xl text-center select-none ${getCellStyles(score, i, j)}`}
                                                            disabled={i === j}
                                                        >
                                                            {score.toFixed(0)}%
                                                        </button>
                                                    </td>
                                                );
                                            })}
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>

                        {/* Tooltip / Status Bar */}
                        <div className="mt-4 p-3 bg-slate-50 rounded-2xl border border-slate-100 flex items-center justify-between text-xs text-slate-500">
                            {hoveredCell && hoveredCell.i !== hoveredCell.j ? (
                                <p>
                                    Menyorot: <span className="font-semibold text-slate-700">Doc {hoveredCell.i + 1}</span> dengan{" "}
                                    <span className="font-semibold text-slate-700">Doc {hoveredCell.j + 1}</span> &rarr;{" "}
                                    <span className={`font-bold px-1.5 py-0.5 rounded-md ${
                                        hoveredCell.score >= 70 ? "bg-rose-100 text-rose-700" : 
                                        hoveredCell.score >= 30 ? "bg-amber-100 text-amber-800" : "bg-emerald-100 text-emerald-800"
                                    }`}>{hoveredCell.score.toFixed(1)}% Kemiripan</span>
                                </p>
                            ) : (
                                <p>Arahkan kursor ke atas sel untuk melihat detail perbandingan berpasangan.</p>
                            )}
                            <span className="hidden sm:inline text-slate-400">Dimensi: {N} &times; {N}</span>
                        </div>
                    </div>

                    {/* Panel Perbandingan Dokumen Side-by-Side */}
                    {selectedPair && (
                        <div className="p-6 bg-slate-900 text-slate-100 rounded-3xl shadow-xl border border-slate-800 transition-all duration-300">
                            <div className="flex items-center justify-between border-b border-slate-800 pb-4 mb-6">
                                <div className="space-y-1">
                                    <h4 className="text-md font-bold flex items-center gap-2">
                                        <span>Side-by-Side Comparison View</span>
                                        <span className={`text-xs px-2 py-0.5 rounded-full font-bold ${
                                            selectedPair.score >= 70 ? "bg-rose-500/20 text-rose-400 border border-rose-500/30" : 
                                            selectedPair.score >= 30 ? "bg-amber-500/20 text-amber-400 border border-amber-500/30" : 
                                            "bg-emerald-500/20 text-emerald-400 border border-emerald-500/30"
                                        }`}>
                                            {selectedPair.score.toFixed(1)}% Similarity
                                        </span>
                                    </h4>
                                    <p className="text-xs text-slate-400">
                                        Membandingkan dokumen <span className="text-slate-200 font-semibold">Doc {selectedPair.docAIndex + 1}</span> dengan{" "}
                                        <span className="text-slate-200 font-semibold">Doc {selectedPair.docBIndex + 1}</span>.
                                    </p>
                                </div>
                                <button
                                    onClick={() => setSelectedPair(null)}
                                    className="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-slate-200 rounded-full transition-colors"
                                >
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                                    </svg>
                                </button>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div className="space-y-2">
                                    <span className="text-xs font-bold uppercase tracking-wider text-slate-400">Dokumen {selectedPair.docAIndex + 1}</span>
                                    <div className="p-4 bg-slate-950/70 border border-slate-800 rounded-2xl text-sm leading-relaxed text-slate-300 font-normal min-h-[120px] max-h-[300px] overflow-y-auto">
                                        {selectedPair.textA}
                                    </div>
                                </div>
                                <div className="space-y-2">
                                    <span className="text-xs font-bold uppercase tracking-wider text-slate-400">Dokumen {selectedPair.docBIndex + 1}</span>
                                    <div className="p-4 bg-slate-950/70 border border-slate-800 rounded-2xl text-sm leading-relaxed text-slate-300 font-normal min-h-[120px] max-h-[300px] overflow-y-auto">
                                        {selectedPair.textB}
                                    </div>
                                </div>
                            </div>
                            
                            <div className="mt-6 pt-4 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
                                {selectedPair.score >= 70 ? (
                                    <p className="flex items-center gap-1.5 text-rose-400">
                                        <svg className="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                                        </svg>
                                        <span className="font-semibold">Peringatan:</span> Indikasi kemiripan sangat tinggi. Disarankan pemeriksaan manual lebih mendalam.
                                    </p>
                                ) : selectedPair.score >= 30 ? (
                                    <p className="text-amber-400">
                                        <span className="font-semibold">Perhatian:</span> Kemiripan tingkat menengah. Harap periksa apakah mahasiswa mencantumkan referensi sitasi secara benar.
                                    </p>
                                ) : (
                                    <p className="text-emerald-400">
                                        <span className="font-semibold">Aman:</span> Dokumen menunjukkan tingkat kesamaan kata yang wajar.
                                    </p>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- 2. KOMPONEN DASHBOARD UTAMA (MOCK DATA & INTERACTIVE PAGE) ---
        function App() {
            // Mock data tiruan hasil kalkulasi plagiarisme
            const mockData = {
                documents: [
                    "Kecerdasan buatan atau artificial intelligence sangat berkembang pesat di era teknologi industri modern saat ini.",
                    "Artificial intelligence atau kecerdasan buatan mengalami perkembangan yang sangat pesat pada era industri teknologi modern.",
                    "Analisis data raya menggunakan teknologi cloud computing membantu bisnis dalam mengambil keputusan yang cepat dan tepat.",
                    "Penerapan teknologi kecerdasan buatan digunakan untuk mengefisiensikan operasional manufaktur pabrik modern.",
                ],
                // Matriks leksikal kata (TF-IDF)
                tfidf_similarity: [
                    [100.0, 84.74, 4.04, 18.2],
                    [84.74, 100.0, 4.04, 14.5],
                    [4.04, 4.04, 100.0, 8.8],
                    [18.2, 14.5, 8.8, 100.0]
                ],
                // Matriks pemahaman semantik (MiniLM Transformer)
                semantic_similarity: [
                    [100.0, 97.64, 42.82, 65.5],
                    [97.64, 100.0, 42.02, 61.2],
                    [42.82, 42.02, 100.0, 38.4],
                    [65.5, 61.2, 38.4, 100.0]
                ]
            };

            const [selectedTab, setSelectedTab] = useState('semantic'); // 'semantic' atau 'tfidf'

            return (
                <div className="max-w-6xl mx-auto px-4 py-8 md:py-12 space-y-8">
                    {/* Header Premium */}
                    <div className="flex flex-col md:flex-row md:items-center md:justify-between bg-white border border-slate-200/80 p-6 rounded-3xl shadow-xl shadow-slate-100/30 gap-4">
                        <div className="space-y-1">
                            <span className="text-[10px] uppercase font-extrabold tracking-widest text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full">
                                Frontend Demonstration
                            </span>
                            <h1 className="text-2xl font-black text-slate-900 tracking-tight">Plagiarism Analysis Dashboard</h1>
                            <p className="text-xs text-slate-500">Antarmuka visual heatmap interaktif untuk peninjauan berkas tugas mahasiswa.</p>
                        </div>
                        
                        {/* Selector Tab Model */}
                        <div className="bg-slate-100 p-1.5 rounded-2xl flex space-x-1 self-start md:self-center">
                            <button
                                onClick={() => setSelectedTab('semantic')}
                                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                                    selectedTab === 'semantic' 
                                        ? "bg-slate-900 text-white shadow-sm" 
                                        : "text-slate-600 hover:text-slate-900"
                                }`}
                            >
                                Semantic Similarity (Deep Learning)
                            </button>
                            <button
                                onClick={() => setSelectedTab('tfidf')}
                                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                                    selectedTab === 'tfidf' 
                                        ? "bg-slate-900 text-white shadow-sm" 
                                        : "text-slate-600 hover:text-slate-900"
                                }`}
                            >
                                Lexical Similarity (TF-IDF)
                            </button>
                        </div>
                    </div>

                    {/* Informasi Model Aktif */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="p-5 bg-white border border-slate-200/80 rounded-2xl shadow-sm space-y-2">
                            <span className="text-[10px] font-bold text-slate-400 uppercase">Model Pemrosesan</span>
                            <h4 className="text-sm font-extrabold text-slate-800">
                                {selectedTab === 'semantic' ? 'paraphrase-multilingual-MiniLM' : 'TF-IDF Vectorizer'}
                            </h4>
                            <p className="text-xs text-slate-500">
                                {selectedTab === 'semantic' 
                                    ? 'Menganalisis kemiripan makna dan sinonim kata lintas bahasa walaupun susunan kalimat diacak.' 
                                    : 'Menganalisis kemiripan berdasarkan kecocokan karakter kata persis (leksikal) di dalam dokumen.'}
                            </p>
                        </div>
                        <div className="p-5 bg-white border border-slate-200/80 rounded-2xl shadow-sm space-y-2">
                            <span className="text-[10px] font-bold text-slate-400 uppercase">Jumlah Dokumen</span>
                            <h4 className="text-sm font-extrabold text-slate-800">{mockData.documents.length} Dokumen Mahasiswa</h4>
                            <p className="text-xs text-slate-500">Seluruh tugas mahasiswa dihitung kemiripannya secara berpasangan (Pairwise NxN).</p>
                        </div>
                        <div className="p-5 bg-white border border-slate-200/80 rounded-2xl shadow-sm space-y-2">
                            <span className="text-[10px] font-bold text-slate-400 uppercase">Status Integrasi</span>
                            <div className="flex items-center gap-1.5 text-xs text-slate-500">
                                <span className="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></span>
                                <span className="font-semibold text-slate-700">Celery & Redis Worker Online</span>
                            </div>
                            <p className="text-xs text-slate-500">Backend Flask API siap memproses unggahan file baru secara asinkron.</p>
                        </div>
                    </div>

                    {/* Render Heatmap */}
                    <SimilarityHeatmap 
                        matrix={selectedTab === 'semantic' ? mockData.semantic_similarity : mockData.tfidf_similarity} 
                        documents={mockData.documents} 
                    />
                </div>
            );
        }

        // Render aplikasi ke elemen #root
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
